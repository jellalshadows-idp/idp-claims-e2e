name: idp-drift

# Claims repo caller of the engine's drift check (docs/pipelines.md). GitHub
# disables schedules in public repos after 60 days without activity; re-enable
# with: gh workflow enable drift.yaml

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: idp-wet
  cancel-in-progress: false
  queue: max

jobs:
  drift:
    uses: jellalshadows-idp/idp-engine/.github/workflows/drift.yaml@a5445a23bf2731da3bdb6d66aced0767858c4e79 # unreleased
    permissions:
      contents: read
      issues: write
    secrets:
      IDP_READER_PRIVATE_KEY: ${{ secrets.IDP_READER_PRIVATE_KEY }}
      IDP_STATE_PASSPHRASE: ${{ secrets.IDP_STATE_PASSPHRASE }}
      IDP_WRITER_PRIVATE_KEY: ${{ secrets.IDP_WRITER_PRIVATE_KEY }}
